[package]
name = "qmc5883p-wokwi-chip"
description = "Wokwi custom chip wrapping the qmc5883p-sim behavioral model"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
# Modules live in `folder.rs` plus `folder/`, never in `folder/mod.rs`.
mod_module_files = "deny"

[dependencies]
qmc5883p-sim = { path = "../../qmc5883p-sim" }
wokwi_chip_ll = "0.2.0"

[profile.release]
opt-level = "s"
lto = true
